name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (both flavors)
        run: ./gradlew --no-daemon testStandardDebugUnitTest testProctorDebugUnitTest

      - name: Android lint (both flavors)
        run: ./gradlew --no-daemon lintStandardDebug lintProctorDebug

      - name: Assemble debug APKs (both flavors)
        run: ./gradlew --no-daemon assembleStandardDebug assembleProctorDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
