name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check (format, lint, unit tests, debug APKs)
        # Unqualified task names run in every module that has them, so a new app in apps/ is covered
        # without editing this file. An app wires its own extra lint tasks into `check`.
        run: ./gradlew --no-daemon spotlessCheck assembleDebug check

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            apps/*/build/reports/tests/**
            apps/*/build/reports/lint-results-*.html
          if-no-files-found: ignore
